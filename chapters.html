<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE360 — Choose Your Chapters</title>
<style>
  :root{
    --bg:#f7f8fc; --card:#fff; --ink:#1c2340; --muted:#8a93b5;
    --accent:#7b8cf5; --accent-dark:#5b6ee8; --border:#e6e9f4; --radius:16px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5;}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 5%;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20;}
  .brand{font-size:1.05rem;color:var(--ink);text-decoration:none;}
  .brand b{font-weight:800;}
  .brand span{color:var(--accent-dark);font-weight:600;margin-left:6px;}
  .avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#22d3ee);color:#fff;font-weight:800;font-size:.9rem;display:flex;align-items:center;justify-content:center;}
  .wrap{max-width:860px;margin:0 auto;padding:30px 20px 120px;}
  .steps{display:flex;gap:12px;margin-bottom:30px;}
  .steps span{flex:1;height:4px;border-radius:999px;background:#dfe3f2;}
  .steps span.done{background:var(--accent-dark);}
  .back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.95rem;margin-bottom:18px;}
  .back:hover{color:var(--accent-dark);}
  h1{font-size:clamp(1.6rem,4vw,2.2rem);font-weight:800;margin-bottom:8px;}
  .subtitle{color:var(--muted);margin-bottom:30px;font-size:1.02rem;}

  .subj-block{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:20px 22px;margin-bottom:22px;}
  .subj-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px;}
  .subj-head h3{font-size:1.1rem;font-weight:800;}
  .subj-head .tch{color:var(--muted);font-size:.85rem;font-weight:600;margin-left:8px;}
  .mini-btns{display:flex;gap:8px;}
  .mini-btn{padding:5px 14px;border-radius:999px;border:1.5px solid var(--border);background:#fff;font-size:.8rem;font-weight:700;color:#5a6284;cursor:pointer;}
  .mini-btn:hover{border-color:var(--accent);color:var(--accent-dark);}
  .ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .ch-item{
    display:flex;gap:10px;align-items:flex-start;
    border:1.5px solid var(--border);border-radius:10px;padding:10px 12px;
    cursor:pointer;user-select:none;transition:all .12s;background:#fff;
  }
  .ch-item:hover{border-color:#c9d2f7;}
  .ch-item.on{border-color:var(--accent);background:#f2f4ff;}
  .ch-item .cbox{
    width:20px;height:20px;border-radius:6px;border:2px solid #cfd6ee;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;font-size:.75rem;color:transparent;margin-top:2px;
  }
  .ch-item.on .cbox{background:var(--accent);border-color:var(--accent);color:#fff;}
  .ch-item .ch-name{font-weight:700;font-size:.88rem;}
  .ch-item .ch-meta{color:var(--muted);font-size:.78rem;font-weight:600;}

  .footbar{
    position:fixed;left:0;right:0;bottom:0;z-index:30;
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:14px 6%;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);
    border-top:1px solid var(--border);flex-wrap:wrap;
  }
  .footbar .meta{color:var(--muted);font-size:.92rem;font-weight:600;}
  .footbar .meta b{color:var(--ink);}
  .go-btn{
    padding:13px 34px;border-radius:999px;border:none;
    background:linear-gradient(135deg,var(--accent),var(--accent-dark));
    color:#fff;font-weight:800;font-size:1rem;cursor:pointer;
    box-shadow:0 10px 26px rgba(91,110,232,.3);transition:transform .15s;
  }
  .go-btn:hover{transform:translateY(-2px);}
  .go-btn:disabled{opacity:.5;cursor:not-allowed;transform:none;}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html"><b>JEE360</b><span>Study Planner</span></a>
  <div class="avatar">J</div>
</div>

<div class="wrap">
  <div class="steps">
    <span class="done"></span><span class="done"></span><span></span><span></span>
  </div>
  <a class="back" href="index.html">‹ Back</a>
  <h1>Choose your chapters</h1>
  <p class="subtitle">Jo chapters plan mein chahiye unhe select karo — jo pehle se ho chuke hain unhe hata do. Default: sab selected.</p>
  <div id="subjectBlocks"></div>
</div>

<div class="footbar">
  <span class="meta" id="selMeta">—</span>
  <button class="go-btn" id="goBtn">Continue →</button>
</div>

<script src="data.js"></script>
<script>
(function(){
  const DATA = window.JEE360_DATA.subjects;

  let keys = [];
  try{ keys = JSON.parse(localStorage.getItem('jee360.subjects')||'[]'); }catch(e){}
  if(!keys.length) keys = Object.keys(DATA);
  keys = keys.filter(k=>DATA[k]);

  /* selection: {subj:[chapter nos]} — default sab */
  let sel = {};
  try{ sel = JSON.parse(localStorage.getItem('jee360.chapters')||'{}'); }catch(e){}
  keys.forEach(k=>{
    if(!Array.isArray(sel[k])) sel[k] = DATA[k].chapters.map(c=>c.no);
  });

  const chMins = ch => ch.lectures ? ch.lectures.reduce((a,l)=>a+l.d,0) : ch.v*120;
  const fmtH = m => { const h=Math.floor(m/60); return h + 'h' + (Math.round(m%60)? ' '+Math.round(m%60)+'m':''); };

  function renderBlocks(){
    document.getElementById('subjectBlocks').innerHTML = keys.map(k=>{
      const S = DATA[k];
      return `
      <div class="subj-block" data-subj="${k}">
        <div class="subj-head">
          <h3>${S.name}<span class="tch">${S.teacher}</span></h3>
          <div class="mini-btns">
            <button class="mini-btn" data-all="${k}">Sab select</button>
            <button class="mini-btn" data-none="${k}">Sab hatao</button>
          </div>
        </div>
        <div class="ch-grid">
          ${S.chapters.map(ch=>`
            <div class="ch-item ${sel[k].includes(ch.no)?'on':''}" data-k="${k}" data-no="${ch.no}">
              <span class="cbox">✓</span>
              <span>
                <span class="ch-name">Ch-${String(ch.no).padStart(2,'0')} : ${ch.name}</span><br>
                <span class="ch-meta">${ch.v} lectures · ~${fmtH(chMins(ch))}</span>
              </span>
            </div>`).join('')}
        </div>
      </div>`;
    }).join('');

    document.querySelectorAll('.ch-item').forEach(el=>{
      el.addEventListener('click', ()=>{
        const k = el.dataset.k, no = +el.dataset.no;
        if(sel[k].includes(no)) sel[k] = sel[k].filter(x=>x!==no);
        else sel[k].push(no);
        el.classList.toggle('on');
        updateMeta();
      });
    });
    document.querySelectorAll('[data-all]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const k=b.dataset.all; sel[k]=DATA[k].chapters.map(c=>c.no); renderBlocks(); updateMeta();
      });
    });
    document.querySelectorAll('[data-none]').forEach(b=>{
      b.addEventListener('click', ()=>{
        const k=b.dataset.none; sel[k]=[]; renderBlocks(); updateMeta();
      });
    });
  }

  function updateMeta(){
    let chs=0, lecs=0, mins=0;
    keys.forEach(k=>{
      DATA[k].chapters.forEach(ch=>{
        if(sel[k].includes(ch.no)){ chs++; lecs+=ch.v; mins+=chMins(ch); }
      });
    });
    document.getElementById('selMeta').innerHTML =
      '<b>'+chs+'</b> chapters · <b>'+lecs+'</b> lectures · ~<b>'+fmtH(mins)+'</b> at 1x';
    document.getElementById('goBtn').disabled = lecs===0;
  }

  document.getElementById('goBtn').addEventListener('click', ()=>{
    localStorage.setItem('jee360.chapters', JSON.stringify(sel));
    window.location.href = 'planner.html';
  });

  renderBlocks(); updateMeta();
})();
</script>

</body>
</html>
