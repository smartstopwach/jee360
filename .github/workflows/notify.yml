name: Daily notifications

on:
  schedule:
    # har slot ke 2 attempts (45 min gap) — GitHub cron kabhi kabhi
    # skip/late hota hai; dedupe hai isliye double kabhi nahi jayega.
    # Odd minutes rakhe hain — round time pe GitHub pe bheed hoti hai.
    - cron: '7 2 * * *'     # 07:37 IST — aaj ka plan
    - cron: '52 2 * * *'    # 08:22 IST — (backup)
    - cron: '37 8 * * *'    # 14:07 IST — half-time check (smart)
    - cron: '22 9 * * *'    # 14:52 IST — (backup)
    - cron: '37 15 * * *'   # 21:07 IST — last call / shabashi
    - cron: '22 16 * * *'   # 21:52 IST — (backup)
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning / afternoon / night'
        required: false

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send notifications
        run: node scripts/notify.js
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
          SLOT: ${{ github.event.inputs.slot }}
