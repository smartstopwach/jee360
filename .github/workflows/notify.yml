name: Daily notifications

on:
  schedule:
    # har 3 ghante (7:37 se 21:37 IST) — har slot ka 45 min baad
    # backup attempt bhi hai; dedupe hai isliye double kabhi nahi jayega.
    - cron: '7 2 * * *'     # 07:37 IST — aaj ka plan
    - cron: '52 2 * * *'    #   backup
    - cron: '7 5 * * *'     # 10:37 IST — nudge
    - cron: '52 5 * * *'    #   backup
    - cron: '7 8 * * *'     # 13:37 IST — nudge
    - cron: '52 8 * * *'    #   backup
    - cron: '7 11 * * *'    # 16:37 IST — nudge
    - cron: '52 11 * * *'   #   backup
    - cron: '7 14 * * *'    # 19:37 IST — nudge
    - cron: '52 14 * * *'   #   backup
    - cron: '7 16 * * *'    # 21:37 IST — last call / shabashi
    - cron: '22 16 * * *'   #   backup (21:52 — 10 baje ke baad silence)
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning / mid1 / mid2 / mid3 / mid4 / night (khaali = current slot, window ke andar)'
        required: false
        type: choice
        options: ['morning','mid1','mid2','mid3','mid4','night','']

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Send notifications
        run: node scripts/notify.js
        env:
          FCM_SA: ${{ secrets.FCM_SA }}
          SLOT: ${{ github.event.inputs.slot }}
