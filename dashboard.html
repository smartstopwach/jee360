<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JEE360 — Today's Study Plan</title>
<style>
  :root{
    --bg:#f7f8fc;
    --card:#ffffff;
    --ink:#1c2340;
    --muted:#8a93b5;
    --accent:#7b8cf5;
    --accent-dark:#5b6ee8;
    --border:#e6e9f4;
    --teal:#2dd4bf;
    --green:#22c55e;
    --mint-bg:#e9fbf5;
    --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5;
  }
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 4%;
    background:#fff;border-bottom:1px solid var(--border);
    position:sticky;top:0;z-index:20;
  }
  .brand{font-size:1.05rem;color:var(--ink);text-decoration:none;}
  .brand b{font-weight:800;}
  .brand span{color:var(--accent-dark);font-weight:600;margin-left:6px;}
  .avatar{
    width:34px;height:34px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),#22d3ee);
    color:#fff;font-weight:800;font-size:.85rem;
    display:flex;align-items:center;justify-content:center;
  }

  .layout{
    max-width:1150px;margin:0 auto;
    display:grid;grid-template-columns:1fr 300px;gap:28px;
    padding:26px 20px 80px;
  }
  @media (max-width:900px){.layout{grid-template-columns:1fr;}}

  .overall{color:var(--muted);font-size:.85rem;font-weight:600;margin-bottom:14px;}

  .plan-head{display:flex;justify-content:space-between;align-items:center;}
  .plan-head h2{
    font-size:.85rem;letter-spacing:1.5px;color:#5a6284;font-weight:800;
  }
  .plan-head .total-time{color:#5a6284;font-weight:700;font-size:.95rem;}
  .plan-sub{color:var(--muted);font-size:.85rem;margin:6px 0 18px;}
  .day-goal{
    margin-top:10px;font-size:.98rem;color:#4a536e;font-weight:600;
    background:#eef1fd;border:1px solid #dde3fb;border-radius:10px;
    padding:10px 16px;display:inline-block;
  }
  .day-goal b{color:var(--accent-dark);}
  .today-progress{
    margin-top:12px;background:#fff;border:1px solid var(--border);
    border-radius:12px;padding:14px 18px;max-width:560px;
  }
  .today-progress .tp-line{
    display:flex;justify-content:space-between;align-items:center;
    font-size:.92rem;color:#4a536e;font-weight:600;margin-bottom:8px;flex-wrap:wrap;gap:6px;
  }
  .today-progress .tp-line b{color:var(--ink);}
  .today-progress .tp-pct{color:var(--accent-dark);font-weight:800;font-size:1.05rem;}
  .tp-bar{height:9px;border-radius:99px;background:#edf0fa;overflow:hidden;}
  .tp-bar i{display:block;height:100%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),#22d3ee);transition:width .3s;}

  /* ---------- VIEW FILTER ---------- */
  .filter-row{display:flex;gap:10px;margin:4px 0 20px;flex-wrap:wrap;}
  .f-btn{
    padding:8px 20px;border-radius:999px;border:1.5px solid var(--border);
    background:#fff;font-weight:700;font-size:.88rem;cursor:pointer;color:#5a6284;
    transition:all .15s;
  }
  .f-btn:hover{border-color:var(--accent);}
  .f-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}

  /* ---------- DAY SECTIONS ---------- */
  .day-section{margin-bottom:28px;}
  .day-head{
    display:flex;justify-content:space-between;align-items:center;
    font-weight:800;color:#1c2340;padding:10px 16px;
    background:#eef1fd;border:1px solid #dde3fb;border-radius:12px;
    margin-bottom:12px;font-size:.95rem;
  }
  .day-head .dh-time{color:var(--accent-dark);}
  .day-section.today .day-head{background:#e2e8ff;border-color:#c9d4fb;}
  .today-tag{
    background:var(--accent-dark);color:#fff;padding:2px 10px;border-radius:999px;
    font-size:.68rem;margin-left:8px;letter-spacing:1.5px;vertical-align:middle;
  }
  .mini-task{
    display:flex;gap:12px;align-items:center;
    background:#fff;border:1px solid var(--border);border-radius:10px;
    padding:9px 14px;margin-bottom:8px;font-size:.88rem;color:#4a536e;
  }
  .mini-task .mt-type{font-size:.66rem;font-weight:800;color:#9aa3c7;letter-spacing:1px;min-width:56px;}
  .mini-task .mt-title{flex:1;font-weight:600;}
  .mini-task .mt-time{color:#8a93b5;font-weight:700;white-space:nowrap;}
  .mini-undo{
    padding:4px 12px !important;font-size:.78rem !important;border-radius:8px;
    border:1.5px solid #f3c6d8;color:#e05b8a;background:#fff;font-weight:800;cursor:pointer;
  }
  .mini-undo:hover{background:#fdf0f5;border-color:#e05b8a;}
  .mini-task.done-row .mt-title{text-decoration:line-through;color:#b6bdd8;}
  .day-note{color:#8a93b5;font-size:.82rem;margin:4px 0 0 4px;}
  .plan-sub b{color:var(--ink);}

  /* ---------- TASK CARD ---------- */
  .task{
    background:var(--card);
    border:1px solid var(--border);
    border-left:4px solid var(--teal);
    border-radius:var(--radius);
    padding:18px 22px;
    margin-bottom:16px;
  }
  .task.done-task{opacity:.55;}
  .task .t-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .task .subj{font-size:.75rem;font-weight:800;letter-spacing:1px;color:var(--accent-dark);text-transform:uppercase;}
  .task .teacher{color:#b6bdd8;font-size:.8rem;font-weight:600;margin-left:8px;}
  .task .type{font-size:.7rem;font-weight:800;letter-spacing:1.5px;color:#9aa3c7;}
  .task h3{font-size:1.05rem;font-weight:800;margin:2px 0 4px;}
  .task .chap{color:var(--muted);font-size:.87rem;}
  .task .t-bottom{
    display:flex;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap;gap:10px;
  }
  .task .time{font-size:.9rem;color:#4a536e;font-weight:700;}
  .task .time small{color:#b6bdd8;font-weight:600;}
  .task .actions{display:flex;gap:10px;}
  .btn{
    padding:8px 18px;border-radius:10px;font-weight:700;font-size:.88rem;
    cursor:pointer;border:1.5px solid var(--border);background:#fff;color:#5a6284;
    transition:all .15s;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent-dark);}
  .btn.done-btn{
    background:var(--accent);border-color:var(--accent);color:#fff;
  }
  .btn.done-btn:hover{background:var(--accent-dark);}
  .all-done{
    background:var(--mint-bg);border:1px solid #bceede;border-radius:var(--radius);
    padding:26px;text-align:center;font-weight:700;color:#0f9d77;
  }

  /* ---------- SIDEBAR ---------- */
  .side-card{
    background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 22px;margin-bottom:20px;
  }
  .side-card.health{background:var(--mint-bg);border-color:#d1f2e5;}
  .side-card h4{font-size:.92rem;font-weight:700;color:#5a6284;margin-bottom:10px;}
  .health-status{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1rem;margin-bottom:6px;}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--green);}
  .dot.warn{background:#f59e0b;}
  .health-desc{color:#5a6284;font-size:.87rem;}
  .health-desc b{color:var(--ink);}
  .subj-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:9px 0;border-top:1px dashed var(--border);font-size:.92rem;
  }
  .subj-row:first-of-type{border-top:none;}
  .subj-row .nm{font-weight:700;}
  .subj-row .tch{display:block;color:#b6bdd8;font-size:.76rem;font-weight:600;}
  .subj-row .pct{color:var(--muted);font-weight:700;font-size:.85rem;}
  .bar{height:5px;border-radius:99px;background:#edf0fa;margin:4px 0 2px;overflow:hidden;}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#22d3ee);border-radius:99px;}
</style>
</head>
<body>

<div class="topbar">
  <a class="brand" href="index.html"><b>JEE360</b><span>Study Planner</span></a>
  <div class="avatar">J</div>
</div>

<div class="layout">
  <main>
    <p class="overall" id="overall">0 of 0 done</p>
    <div class="plan-head">
      <h2>TODAY'S STUDY PLAN</h2>
      <span class="total-time" id="todayTotal">🕐 —</span>
    </div>
    <p class="day-goal" id="dayLine"></p>
    <div class="today-progress" id="todayProgress"></div>
    <p class="plan-sub" id="planSub"></p>
    <div class="filter-row">
      <button class="f-btn active" data-range="3">📅 3 Din</button>
      <button class="f-btn" data-range="7">7 Din</button>
      <button class="f-btn" data-range="0" id="fullBtn">Pura Plan</button>
    </div>
    <div id="taskList"></div>
    <p class="plan-sub" id="movedNote" style="margin-top:14px"></p>
  </main>

  <aside>
    <div class="side-card health">
      <h4>Your plan health</h4>
      <div class="health-status"><span class="dot" id="healthDot"></span><span id="healthLabel">On track</span></div>
      <p class="health-desc" id="healthDesc">You're completing <b>100%</b> of your planned work.</p>
    </div>
    <div class="side-card">
      <h4>Your subjects</h4>
      <div id="subjList"></div>
    </div>
  </aside>
</div>

<script src="data.js"></script>
<script>
(function(){
  /* ---------------- CURRICULUM (from data.js master file) ---------------- */
  const CURRICULUM = window.JEE360_DATA.subjects;

  /* ---------------- PLAN ---------------- */
  let plan = {};
  try{ plan = JSON.parse(localStorage.getItem('jee360.plan')||'{}'); }catch(e){}
  let subjects = (plan.subjects||[]).filter(k=>CURRICULUM[k]);
  if(!subjects.length) subjects = Object.keys(CURRICULUM);
  const days  = plan.days  || 90;
  const speed = plan.speed || 1.25;
  const mode  = plan.mode  || 'weekly';

  if(!plan.startDate){ plan.startDate = new Date().toISOString().slice(0,10);
    localStorage.setItem('jee360.plan', JSON.stringify(Object.assign(plan,{subjects,days,speed,mode}))); }

  /* ---------------- BUILD TASKS ---------------- */
  function buildSubjectTasks(key){
    const s = CURRICULUM[key]; const tasks = []; let lecNo = 0, dppNo = 0;
    s.chapters.forEach((ch, ci)=>{
      const chLabel = 'Ch - ' + String(ch.no).padStart(2,'0') + ' : ' + ch.name;
      for(let i=1;i<=ch.v;i++){
        lecNo++;
        const L = ch.lectures && ch.lectures[i-1];   // real lecture data if available
        const lecMins = L ? L.d : 120;   // default: 2h at 1x (jab tak real duration na aaye)
        const title = L
          ? ch.name + ' ' + String(i).padStart(2,'0') + ' : ' + L.t
          : String(lecNo).padStart(2,'0') + ' : ' + ch.name + (ch.v>1 ? ' (Lecture ' + String(i).padStart(2,'0') + ')' : '');
        tasks.push({ id:key+'-L'+lecNo, subj:key, type:'LECTURE', mins:lecMins, scaled:true,
          title:title,
          chap:chLabel });
      }
      /* NOTE: DPPs are NOT scheduled as daily tasks —
         DPP ka alag scene hai (aayega baad mein).
         Data data.js mein saved hai (ch.e counts), bas
         daily path mein sirf LECTURES ginte hain. */
    });
    return tasks;
  }

  const bySubject = {};
  subjects.forEach(k=> bySubject[k] = buildSubjectTasks(k));

  /* ---------------- 90/120-DAY PATH (chapter continuity) ----------------
     RULE 1: ek din me max 2 chapters (2 subjects).
     RULE 2: jo chapter chal raha hai, WAHI agle din continue hota hai —
             jab tak khatam na ho. Khatam hone par hi us slot me agla
             subject ka chapter aata hai (rotation se variety milti hai).
     Single mode: ek subject poora khatam, phir agla. */
  const effMins = t => t.scaled ? t.mins/speed : t.mins;
  const totalEffMins = subjects.reduce((s,k)=>s+bySubject[k].reduce((a,t)=>a+effMins(t),0),0);
  const quota = totalEffMins / days;   // DAILY GOAL (mins/day)

  const queues = {}; subjects.forEach(k=> queues[k] = bySubject[k].slice());
  const baseDayOf = {};
  const allTasks = [];

  if(mode === 'single'){
    /* ek subject poora, phir agla — din quota se bharte jao */
    let day = 1, acc = 0;
    for(const k of subjects){
      const q = queues[k];
      while(q.length){
        const t = q.shift();
        baseDayOf[t.id] = Math.min(day, days); allTasks.push(t); acc += effMins(t);
        if(acc >= quota && day < days){ day++; acc = 0; }
      }
    }
  } else {
    /* Weekly: 2 chapter-slots — chapter continue, khatam pe SMART pick.
       SMART RULE: agla chapter us subject ka aata hai jo apne target
       pace se sabse zyada peeche hai (weighted balancing) —
       bade subjects (phy/math) zyada baar, chhote spread-out.
       Chemistry ki 2 branches ek saath avoid hoti hain. */
    const sizeOf = {}; subjects.forEach(k=> sizeOf[k] = bySubject[k].reduce((a,t)=>a+effMins(t),0));
    const totalSize = subjects.reduce((s,k)=>s+sizeOf[k],0) || 1;
    const schedMins = {}; subjects.forEach(k=> schedMins[k]=0);
    let totalSched = 0;
    const CHEM = { oc:1, pc:1, ioc:1 };

    const pickNext = (exclude)=>{
      const cands = subjects.filter(k=>queues[k].length && k!==exclude);
      if(!cands.length) return subjects.find(k=>queues[k].length) || null;
      const deficit = k => (totalSched + 60) * (sizeOf[k]/totalSize) - schedMins[k];
      cands.sort((a,b)=>deficit(b)-deficit(a));
      let pick = cands[0];
      /* dono slots chemistry na ho jayein — thoda balance */
      if(exclude && CHEM[exclude] && CHEM[pick]){
        const alt = cands.find(k=>!CHEM[k]);
        if(alt && deficit(alt) >= 0.7*deficit(pick)) pick = alt;
      }
      return pick;
    };

    const slots = [];
    slots[0] = pickNext(null);
    slots[1] = pickNext(slots[0]);

    for(let day=1; day<=days; day++){
      const anyLeft = subjects.some(k=>queues[k].length);
      if(!anyLeft) break;
      /* har din ka target = bacha hua content / bache hue din
         => plan EXACT 90/120 din tak chalta hai, jaldi khatam nahi */
      const dayTarget = (totalEffMins - totalSched) / (days - day + 1);
      const target = dayTarget / Math.max(1, slots.filter(Boolean).length);
      for(let si=0; si<slots.length; si++){
        let acc = 0;
        while(acc < target){
          let k = slots[si];
          const other = slots[1-si];
          if(!k || !queues[k].length){ slots[si] = pickNext(other); k = slots[si]; }
          if(!k || !queues[k].length) break;
          const t = queues[k].shift();
          baseDayOf[t.id] = day; allTasks.push(t);
          acc += effMins(t); schedMins[k] += effMins(t); totalSched += effMins(t);
          /* chapter KHATAM? tabhi slot smartly agla subject uthata hai */
          if(!queues[k].length || queues[k][0].chap !== t.chap){
            slots[si] = pickNext(other);
          }
        }
      }
    }
  }
  /* leftovers (agar bache) → last day */
  subjects.forEach(k=>{ while(queues[k].length){ const t=queues[k].shift(); baseDayOf[t.id]=days; allTasks.push(t); } });

  /* ---------------- STATE ---------------- */
  let done = new Set();
  try{ done = new Set(JSON.parse(localStorage.getItem('jee360.done')||'[]')); }catch(e){}
  const saveDone = ()=> localStorage.setItem('jee360.done', JSON.stringify([...done]));

  const effMins2_removed = null; /* (scheduling moved above) */

  /* moves: task moved to a later day ("I'll do this next day") */
  let moves = {};
  try{ moves = JSON.parse(localStorage.getItem('jee360.moves')||'{}'); }catch(e){}
  const saveMoves = ()=> localStorage.setItem('jee360.moves', JSON.stringify(moves));
  const dayOf = t => moves[t.id] || baseDayOf[t.id];

  /* current day of the plan (from start date) */
  const startDate = new Date((plan.startDate || new Date().toISOString().slice(0,10)) + 'T00:00:00');
  const currentDay = Math.max(1, Math.min(days,
    Math.floor((Date.now() - startDate.getTime()) / 86400000) + 1));

  const taskById = {}; allTasks.forEach(t=>taskById[t.id]=t);

  function fmt(mins){
    mins=Math.round(mins);
    const h=Math.floor(mins/60), m=mins%60;
    return (h? h+'h ':'') + m + 'm';
  }

  /* ---------------- RENDER ---------------- */
  /* ---------------- RENDER ---------------- */
  let viewRange = 3;   // 3 | 7 | 0 (0 = full plan)

  function dateFor(d){
    const dt = new Date(startDate.getTime() + (d-1)*86400000);
    return dt.toLocaleDateString('en-IN', {weekday:'short', day:'numeric', month:'short'});
  }
  function fullCard(t){
    const s = CURRICULUM[t.subj];
    const bd = dayOf(t);
    const backlog = bd < currentDay ? ' · <span style="color:#e05b8a;font-weight:800">BACKLOG · DAY ' + bd + '</span>' : '';
    const timeStr = t.scaled
      ? '🕐 <b>'+fmt(t.mins/speed)+'</b> <small>· '+fmt(t.mins)+' at 1x</small>'
      : '🕐 <b>'+fmt(t.mins)+'</b>';
    return `
    <div class="task">
      <div class="t-top">
        <span><span class="subj">${s.name}</span><span class="teacher">${s.teacher}</span></span>
        <span class="type">${t.type}${backlog}</span>
      </div>
      <h3>${t.title}</h3>
      <p class="chap">${t.chap} ↗</p>
      <div class="t-bottom">
        <span class="time">${timeStr}</span>
        <span class="actions">
          <button class="btn" data-move="${t.id}">⏭ Next day</button>
          <button class="btn done-btn" data-done="${t.id}">✓ Done</button>
        </span>
      </div>
    </div>`;
  }
  function miniRow(t){
    const isDone = done.has(t.id);
    const wasMoved = moves[t.id] && !isDone;
    return `<div class="mini-task${isDone?' done-row':''}">
      <span>${isDone?'✅':(wasMoved?'⏭':'⬜')}</span>
      <span class="mt-type">${t.type}</span>
      <span class="mt-title">${t.title}${wasMoved?' <span style="color:#e05b8a;font-size:.72rem;font-weight:800">(MOVED)</span>':''}</span>
      <span class="mt-time">${fmt(effMins(t))}</span>
      ${wasMoved?'<button class="btn mini-undo" data-undo="'+t.id+'">↩ Wapas</button>':''}
      ${isDone?'<button class="btn mini-undo" data-undone="'+t.id+'">↩ Un-done</button>':''}
    </div>`;
  }

  function render(){
    /* today = tasks scheduled up to current day (incl. backlog) */
    const todayPending = allTasks.filter(t=>dayOf(t) <= currentDay && !done.has(t.id));
    const todayAll = allTasks.filter(t=>dayOf(t) <= currentDay);
    const leftMins = todayPending.reduce((s,t)=>s+effMins(t),0);
    const pctToday = todayAll.length? Math.round((todayAll.length-todayPending.length)/todayAll.length*100):0;

    document.getElementById('overall').textContent = done.size + ' of ' + allTasks.length + ' done';
    document.getElementById('todayTotal').textContent = '🕐 ' + fmt(leftMins);
    document.getElementById('dayLine').innerHTML =
      '📅 Day <b>' + currentDay + '</b> of <b>' + days + '</b> · ' + dateFor(currentDay) +
      ' · Daily goal <b>' + fmt(quota) + '</b> <span style="color:#8a93b5">at ' + speed + 'x</span>';
    document.getElementById('planSub').innerHTML =
      '<b>' + pctToday + '% completed</b> · ' + todayPending.length + ' to go · ' +
      fmt(leftMins) + ' left <span style="color:#b6bdd8">at ' + speed + 'x</span>';

    /* aaj ka progress: kitne lec ho gaye, kitna time, % */
    const todaySched = allTasks.filter(t=>dayOf(t)===currentDay);
    const todayDone  = todaySched.filter(t=>done.has(t.id));
    const tpTot  = todaySched.reduce((s,t)=>s+effMins(t),0);
    const tpDone = todayDone.reduce((s,t)=>s+effMins(t),0);
    const tpPct  = tpTot ? Math.round(tpDone/tpTot*100) : 0;
    document.getElementById('todayProgress').innerHTML = `
      <div class="tp-line">
        <span>Aaj: <b>${todayDone.length}/${todaySched.length}</b> lectures done · <b>${fmt(tpDone)}</b> / ${fmt(tpTot)}</span>
        <span class="tp-pct">${tpPct}%</span>
      </div>
      <div class="tp-bar"><i style="width:${tpPct}%"></i></div>`;
    document.getElementById('fullBtn').textContent = 'Pura Plan (' + days + ' din)';

    /* group tasks by their scheduled day */
    const byDay = {};
    allTasks.forEach(t=>{ const d=dayOf(t); (byDay[d] = byDay[d]||[]).push(t); });

    let startD, endD;
    if(viewRange === 0){ startD = 1; endD = days; }
    else { startD = currentDay; endD = Math.min(days, currentDay + viewRange - 1); }

    let html = '';
    for(let d = startD; d <= endD; d++){
      const isToday = d === currentDay;
      let rows = '', headTime = 0, note = '';

      if(isToday){
        headTime = leftMins;
        rows = todayPending.length
          ? todayPending.map(fullCard).join('')
          : '<div class="all-done">🎉 All done for today! Day ' + d + ' complete — kal milte hain.</div>';
        /* recently completed — galti se Done? yahin se un-done */
        const recent = [...done].slice(-5).reverse().map(id=>taskById[id]).filter(Boolean);
        if(recent.length){
          rows += '<p class="day-note" style="margin:14px 0 8px">✅ Recently completed:</p>' +
                  recent.map(miniRow).join('');
        }
      }
      else if(d < currentDay){
        const tasksD = byDay[d] || [];
        const doneD = tasksD.filter(t=>done.has(t.id));
        const pendD = tasksD.length - doneD.length;
        headTime = doneD.reduce((s,t)=>s+effMins(t),0);
        rows = doneD.map(miniRow).join('');
        if(pendD) note = '<p class="day-note">🔴 ' + pendD + ' task' + (pendD>1?'s':'') + ' pending → aaj ke backlog mein</p>';
        if(!tasksD.length) rows = '<p class="day-note">—</p>';
      }
      else {
        const tasksD = (byDay[d] || []).filter(t=>!done.has(t.id));
        headTime = tasksD.reduce((s,t)=>s+effMins(t),0);
        rows = tasksD.length ? tasksD.map(miniRow).join('') : '<p class="day-note">Koi task nahi — buffer day 😌</p>';
      }

      html += `
      <div class="day-section${isToday?' today':''}">
        <div class="day-head">
          <span>📅 Day ${d} · ${dateFor(d)}${isToday?'<span class="today-tag">AAJ</span>':''}</span>
          <span class="dh-time">${fmt(headTime)}</span>
        </div>
        ${rows}${note}
      </div>`;
    }

    const list = document.getElementById('taskList');
    list.innerHTML = html;

    /* moved-to-tomorrow note + undo all */
    const movedIds = Object.keys(moves).filter(id => moves[id] === currentDay+1 && !done.has(id));
    document.getElementById('movedNote').innerHTML = movedIds.length
      ? '⏭ <b>' + movedIds.length + '</b> task' + (movedIds.length>1?'s':'') + ' moved to tomorrow (Day ' + (currentDay+1) + ') ' +
        '<button class="btn mini-undo" id="undoAll">↩ Sab wapas lao</button>'
      : '';

    /* sidebar */
    const startDate = new Date(plan.startDate || todayKey);
    const elapsed = Math.max(1, Math.floor((Date.now()-startDate.getTime())/86400000)+1);
    const expected = allTasks.length * Math.min(1, elapsed/days);
    const ratio = expected>0 ? Math.min(100, Math.round((done.size/expected)*100)) : 100;
    const onTrack = ratio>=80 || done.size>=expected;
    document.getElementById('healthLabel').textContent = onTrack? 'On track' : 'Catching up';
    document.getElementById('healthDot').className = 'dot' + (onTrack?'':' warn');
    document.getElementById('healthDesc').innerHTML =
      "You're completing <b>" + (expected<1?100:ratio) + "%</b> of your planned work.";

    document.getElementById('subjList').innerHTML = subjects.map(k=>{
      const arr = bySubject[k];
      const d = arr.filter(t=>done.has(t.id)).length;
      const pct = Math.round(d/arr.length*100);
      return `
        <div class="subj-row">
          <span><span class="nm">${CURRICULUM[k].name}</span><span class="tch">${CURRICULUM[k].teacher}</span></span>
          <span class="pct">${pct}%</span>
        </div>
        <div class="bar"><i style="width:${pct}%"></i></div>`;
    }).join('');

    /* data status: internal only — console mein dikhta hai, UI mein nahi */
    let exact = 0, totalLec = 0;
    subjects.forEach(k=>{
      CURRICULUM[k].chapters.forEach(ch=>{
        totalLec += ch.v;
        if(ch.lectures) exact += Math.min(ch.lectures.length, ch.v);
      });
    });
    console.log('[JEE360 data] exact durations: ' + exact + '/' + totalLec + ' lectures');

    /* events */
    list.querySelectorAll('[data-done]').forEach(b=>{
      b.addEventListener('click', ()=>{ done.add(b.dataset.done); saveDone(); render(); });
    });
    list.querySelectorAll('[data-move]').forEach(b=>{
      b.addEventListener('click', ()=>{
        moves[b.dataset.move] = currentDay + 1;   // "I'll do this next day"
        saveMoves(); render();
      });
    });
    /* undo: galti se move hua toh wapas original day pe */
    list.querySelectorAll('[data-undo]').forEach(b=>{
      b.addEventListener('click', ()=>{
        delete moves[b.dataset.undo];
        saveMoves(); render();
      });
    });
    /* un-done: galti se Done hua toh wapas pending */
    list.querySelectorAll('[data-undone]').forEach(b=>{
      b.addEventListener('click', ()=>{
        done.delete(b.dataset.undone);
        saveDone(); render();
      });
    });
    const ua = document.getElementById('undoAll');
    if(ua) ua.addEventListener('click', ()=>{
      Object.keys(moves).forEach(id=>{ if(moves[id]===currentDay+1 && !done.has(id)) delete moves[id]; });
      saveMoves(); render();
    });
  }

  document.querySelectorAll('.f-btn').forEach(b=>{
    b.addEventListener('click', ()=>{
      document.querySelectorAll('.f-btn').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      viewRange = +b.dataset.range;
      render();
    });
  });

  render();
})();
</script>

</body>
</html>
